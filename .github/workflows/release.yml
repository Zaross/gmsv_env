name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build all targets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 \
            gcc-mingw-w64-i686 \
            gcc-multilib

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: >-
            x86_64-pc-windows-gnu
            i686-pc-windows-gnu
            x86_64-unknown-linux-gnu
            i686-unknown-linux-gnu

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: |
          cargo +nightly build --release --target x86_64-pc-windows-gnu
          cargo +nightly build --release --target i686-pc-windows-gnu
          cargo +nightly build --release --target x86_64-unknown-linux-gnu
          cargo +nightly build --release --target i686-unknown-linux-gnu

      - name: Collect artifacts
        run: |
          cp target/x86_64-pc-windows-gnu/release/gmsv_dotenv.dll       gmsv_dotenv_win64.dll
          cp target/i686-pc-windows-gnu/release/gmsv_dotenv.dll          gmsv_dotenv_win32.dll
          cp target/x86_64-unknown-linux-gnu/release/libgmsv_dotenv.so   gmsv_dotenv_linux64.so
          cp target/i686-unknown-linux-gnu/release/libgmsv_dotenv.so     gmsv_dotenv_linux.so

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          retention-days: 7
          path: |
            gmsv_dotenv_win64.dll
            gmsv_dotenv_win32.dll
            gmsv_dotenv_linux64.so
            gmsv_dotenv_linux.so

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "gmsv_dotenv ${{ github.ref_name }}"
          body: "Garry's Mod binary module – dotenv loader."
          files: |
            gmsv_dotenv_win64.dll
            gmsv_dotenv_win32.dll
            gmsv_dotenv_linux64.so
            gmsv_dotenv_linux.so
